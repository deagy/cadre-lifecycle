name: regenerate

# Automates the manual procedure documented in README.md's "Regenerating
# Assets": clone deagy/cadre at a new revision, run `cadre generate-plugin`
# into a scratch directory (never this checkout directly -- see CLAUDE.md's
# "Regeneration guard caveat"), apply the generated content via
# tools/apply_regeneration.py (which excludes README.md and every
# hand-authored plugin path, same as the manual procedure), bump
# cadre-ref.txt, and open a PR. A human always reviews and merges -- this
# workflow never merges anything itself (agent-autonomy.yaml:
# repository.merge: never).
#
# Triggered by deagy/cadre's notify-lifecycle.yml on every new tag there, via
# repository_dispatch. workflow_dispatch is also available as a manual
# fallback (e.g. to retry after fixing a failed run, or to pick up a change
# without waiting for cadre's own next tag).

on:
  repository_dispatch:
    types: [cadre-release]
  workflow_dispatch:
    inputs:
      cadre_ref:
        description: "deagy/cadre tag or commit to regenerate from (defaults to cadre's latest tag)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cadre-lifecycle
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Determine cadre ref to regenerate from
        id: ref
        # DISPATCH_TAG/DISPATCH_INPUT come from env, not direct ${{ }}
        # interpolation into the script body, so a ref containing shell
        # metacharacters can't be interpreted as a command.
        run: |
          set -eu
          ref="${DISPATCH_TAG:-}"
          if [ -z "$ref" ]; then
            ref="${DISPATCH_INPUT:-}"
          fi
          if [ -z "$ref" ]; then
            ref=$(gh api repos/deagy/cadre/releases/latest --jq .tag_name 2>/dev/null || true)
          fi
          if [ -z "$ref" ]; then
            echo "::error::No cadre ref given (repository_dispatch payload, workflow_dispatch input, and latest release lookup all empty)."
            exit 1
          fi
          echo "value=$ref" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_INPUT: ${{ inputs.cadre_ref }}

      - name: Checkout cadre at ${{ steps.ref.outputs.value }}
        uses: actions/checkout@v4
        with:
          repository: deagy/cadre
          ref: ${{ steps.ref.outputs.value }}
          path: .regen/cadre

      - name: Resolve cadre commit SHA
        id: cadre_commit
        run: echo "value=$(git -C .regen/cadre rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Generate into a scratch directory
        run: .regen/cadre/bin/cadre generate-plugin --output "$RUNNER_TEMP/cadre-lifecycle-regen"

      - name: Apply generated content (README.md and hand-authored plugins excluded)
        run: python3 tools/apply_regeneration.py --generated "$RUNNER_TEMP/cadre-lifecycle-regen" --target .

      - name: Check for drift between core and forge-specific lifecycle skills
        id: duplication_health
        run: |
          set +e
          python3 -m unittest tools.test_plugin_duplication_health -v > /tmp/duplication-health.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/duplication-health.log

      - name: Bump cadre-ref.txt
        run: |
          python3 - "$RUNNER_CADRE_SHA" <<'EOF'
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          path = Path("cadre-ref.txt")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          # The ref is the one non-comment, non-blank line at the end of the file.
          for index in range(len(lines) - 1, -1, -1):
              stripped = lines[index].strip()
              if stripped and not stripped.startswith("#"):
                  lines[index] = sha + "\n"
                  break
          else:
              lines.append(sha + "\n")
          path.write_text("".join(lines), encoding="utf-8")
          EOF
        env:
          RUNNER_CADRE_SHA: ${{ steps.cadre_commit.outputs.value }}

      - name: Clean up scratch checkout
        run: rm -rf .regen

      - name: Check whether anything changed
        id: diff
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: regenerate from cadre ${{ steps.ref.outputs.value }}"
          branch: regen/cadre-${{ steps.ref.outputs.value }}
          delete-branch: true
          title: "chore: regenerate from cadre ${{ steps.ref.outputs.value }}"
          body: |
            Automated regeneration from [deagy/cadre@${{ steps.ref.outputs.value }}](https://github.com/deagy/cadre/releases/tag/${{ steps.ref.outputs.value }}) (`${{ steps.cadre_commit.outputs.value }}`).

            Applied via `tools/apply_regeneration.py` -- README.md, plugin manifests/tools, and `plugins/lifecycle-github/`/`plugins/lifecycle-gitlab/` are excluded by design and were not touched.

            ${{ steps.duplication_health.outputs.status != '0' && '**⚠️ tools/test_plugin_duplication_health.py failed** -- the core lifecycle skills changed in a way that may need manual reconciliation into the GitHub/GitLab plugin forks before merging. See the workflow run log for details.' || '`tools/test_plugin_duplication_health.py` passed -- no reconciliation needed.' }}

            This PR was opened automatically and requires human review before merging (no auto-merge is configured).
          labels: automated-regeneration
