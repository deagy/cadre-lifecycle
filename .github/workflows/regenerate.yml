name: regenerate

# Automates the manual procedure documented in README.md's "Regenerating
# Assets": clone deagy/cadre at a new revision, run `cadre generate-plugin`
# into a scratch directory (never this checkout directly -- see CLAUDE.md's
# "Regeneration guard caveat"), apply the generated content via
# tools/apply_regeneration.py (which excludes README.md and every
# hand-authored plugin path, same as the manual procedure), bump
# cadre-ref.txt, and open a PR. A human always reviews and merges -- this
# workflow never merges anything itself (agent-autonomy.yaml:
# repository.merge: never).
#
# Triggered by deagy/cadre's notify-lifecycle.yml on every new tag there, via
# repository_dispatch. workflow_dispatch is also available as a manual
# fallback (e.g. to retry after fixing a failed run, or to pick up a change
# without waiting for cadre's own next tag).
#
# Split into two jobs deliberately: `generate` executes arbitrary code from a
# second repository (deagy/cadre's own `bin/cadre generate-plugin`, at
# whatever ref triggered this run) and only ever holds a read-only token, so
# a compromised/malicious cadre revision cannot use this workflow to push or
# open anything here. `open-pr` never checks out or executes cadre's code --
# it only applies the diff `generate` already produced and holds the write
# token. Same convention deagy/cadre's own validate.yml uses (SHA-pinned
# actions) for the same reason: this workflow executes checked-out code, so a
# moved tag on an action would be arbitrary code execution in a job that
# (for `generate`) has network access to a second repository, or (for
# `open-pr`) holds a write-scoped token.

on:
  repository_dispatch:
    types: [cadre-release]
  workflow_dispatch:
    inputs:
      cadre_ref:
        description: "deagy/cadre tag or commit to regenerate from (defaults to cadre's latest tag)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      cadre_ref: ${{ steps.ref.outputs.value }}
      cadre_commit: ${{ steps.cadre_commit.outputs.value }}
      duplication_health_status: ${{ steps.duplication_health.outputs.status }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout cadre-lifecycle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine cadre ref to regenerate from
        id: ref
        # DISPATCH_TAG/DISPATCH_INPUT come from env, not direct ${{ }}
        # interpolation into the script body, so a ref containing shell
        # metacharacters can't be interpreted as a command.
        run: |
          set -eu
          ref="${DISPATCH_TAG:-}"
          if [ -z "$ref" ]; then
            ref="${DISPATCH_INPUT:-}"
          fi
          if [ -z "$ref" ]; then
            ref=$(gh api repos/deagy/cadre/releases/latest --jq .tag_name) || {
              echo "::error::Could not look up deagy/cadre's latest release (repository_dispatch payload and workflow_dispatch input were also both empty)."
              exit 1
            }
          fi
          if [ -z "$ref" ]; then
            echo "::error::No cadre ref given (repository_dispatch payload, workflow_dispatch input, and latest release lookup all empty)."
            exit 1
          fi
          echo "value=$ref" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_INPUT: ${{ inputs.cadre_ref }}

      - name: Checkout cadre at ${{ steps.ref.outputs.value }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: deagy/cadre
          ref: ${{ steps.ref.outputs.value }}
          path: .regen/cadre
          persist-credentials: false

      - name: Resolve cadre commit SHA
        id: cadre_commit
        run: echo "value=$(git -C .regen/cadre rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Generate into a scratch directory
        # This is the one step that actually executes cadre's own code
        # (bin/cadre generate-plugin, a script from the second repository
        # checked out above) -- this job never holds a write token, by
        # design (see the workflow-level comment).
        run: .regen/cadre/bin/cadre generate-plugin --output "$RUNNER_TEMP/cadre-lifecycle-regen"

      - name: Apply generated content (README.md and hand-authored plugins excluded)
        run: python3 tools/apply_regeneration.py --generated "$RUNNER_TEMP/cadre-lifecycle-regen" --target .

      - name: Port cline-agents/agents/ and cline-agents/skills/ from the just-applied content
        # Reads this checkout's own agents/ and skills/ (already updated by
        # the previous step) and writes cline-agents/agents/,
        # cline-agents/skills/ -- fails closed (nonzero exit) on any
        # unrecognized source-repo-relative reference, stopping this job
        # before a PR opens rather than shipping a leaked path. cline-agents'
        # own index.ts/package.json/test/README.md are untouched.
        run: python3 tools/port_cline_agents.py --root .

      - name: Check for drift between core and forge-specific lifecycle skills
        id: duplication_health
        run: |
          set +e
          python3 -m unittest tools.test_plugin_duplication_health -v > /tmp/duplication-health.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/duplication-health.log

      - name: Bump cadre-ref.txt
        run: |
          python3 - "$RUNNER_CADRE_SHA" <<'EOF'
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          path = Path("cadre-ref.txt")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          # The ref is the one non-comment, non-blank line at the end of the file.
          for index in range(len(lines) - 1, -1, -1):
              stripped = lines[index].strip()
              if stripped and not stripped.startswith("#"):
                  lines[index] = sha + "\n"
                  break
          else:
              lines.append(sha + "\n")
          path.write_text("".join(lines), encoding="utf-8")
          EOF
        env:
          RUNNER_CADRE_SHA: ${{ steps.cadre_commit.outputs.value }}

      - name: Clean up scratch checkout
        run: rm -rf .regen

      - name: Check whether anything changed
        id: diff
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the diff as a patch artifact
        if: steps.diff.outputs.changed == 'true'
        run: git diff --binary > "$RUNNER_TEMP/regeneration.patch"

      - name: Upload patch artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regeneration-patch
          path: ${{ runner.temp }}/regeneration.patch
          retention-days: 7

  open-pr:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No cadre checkout, no execution of cadre's code in this job -- only
      # the diff `generate` already produced is applied here, by a job that
      # holds the write-scoped token this workflow needs to push a branch
      # and open a PR.
      - name: Checkout cadre-lifecycle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download patch artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
        with:
          name: regeneration-patch
          path: ${{ runner.temp }}

      - name: Apply patch
        # `git diff --binary` already embeds binary hunks in a form `git
        # apply` handles without any extra flag (--binary is a long-removed
        # no-op in modern git and errors as an unknown option on some
        # versions, so it's deliberately not passed here).
        run: git apply "${{ runner.temp }}/regeneration.patch"

      - name: Open pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v7.0.8
        with:
          commit-message: "chore: regenerate from cadre ${{ needs.generate.outputs.cadre_ref }}"
          branch: regen/cadre-${{ needs.generate.outputs.cadre_ref }}
          delete-branch: true
          title: "chore: regenerate from cadre ${{ needs.generate.outputs.cadre_ref }}"
          body: |
            Automated regeneration from [deagy/cadre@${{ needs.generate.outputs.cadre_ref }}](https://github.com/deagy/cadre/releases/tag/${{ needs.generate.outputs.cadre_ref }}) (`${{ needs.generate.outputs.cadre_commit }}`).

            Applied via `tools/apply_regeneration.py` -- README.md, plugin manifests/tools, and `plugins/lifecycle-github/`/`plugins/lifecycle-gitlab/` are excluded by design and were not touched.

            `cline-agents/agents/` and `cline-agents/skills/` were also re-derived from this update via `tools/port_cline_agents.py` -- `cline-agents/index.ts`, its `package.json`, `test/`, and `README.md` are hand-authored and untouched.

            ${{ needs.generate.outputs.duplication_health_status != '0' && '**⚠️ tools/test_plugin_duplication_health.py failed** -- the core lifecycle skills changed in a way that may need manual reconciliation into the GitHub/GitLab plugin forks before merging. See the `generate` job log for details.' || '`tools/test_plugin_duplication_health.py` passed -- no reconciliation needed.' }}

            **Note:** this PR was opened with the default `GITHUB_TOKEN`, so GitHub does not automatically trigger `validate.yml` on it (a platform restriction, not a bug) -- push an empty commit, or close and reopen, to run CI before merging.

            This PR was opened automatically and requires human review before merging (no auto-merge is configured).
          labels: automated-regeneration
