name: Validate

# Runs this repository's four documented test/typecheck suites (see
# AGENTS.md's "Build, Test, and Development Commands" and CLAUDE.md's
# "Commands") on every pull request targeting main and on every push to
# main. Previously these were manual-only -- release.yml only tags and
# publishes a Release for plugin-manifest version bumps on push to main,
# it never runs a test. This workflow is the missing test/typecheck gate.
#
# Each job only installs the toolchain it actually needs (Node for the two
# Cline plugin jobs, Python for the tooling jobs) and
# fails the workflow on any test or typecheck failure -- no step swallows a
# nonzero exit.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cline-plugin:
    name: cline/ (npm test, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cline/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  cline-agents-plugin:
    name: cline-agents/ (npm test, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # cline-agents/ is added by a separate, still-open PR
      # (deagy/cadre-lifecycle#6, branch deagy/cline-agent-team-port). Until
      # that merges, this job intentionally has nothing to run on main --
      # it must not fail the workflow just because the directory doesn't
      # exist yet, but it also must not silently disappear once the
      # directory lands. Once merged, package-lock.json's presence drives
      # normal npm ci/test/typecheck below with no further changes needed
      # here.
      - name: Check for cline-agents/
        id: probe
        run: |
          if [ -f cline-agents/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "cline-agents/package.json not found on this ref (expected until deagy/cadre-lifecycle#6 merges) -- skipping this job's remaining steps."
          fi
      - uses: actions/setup-node@v4
        if: steps.probe.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cline-agents/package-lock.json
      - name: npm ci
        if: steps.probe.outputs.present == 'true'
        working-directory: cline-agents
        run: npm ci
      - name: npm test
        if: steps.probe.outputs.present == 'true'
        working-directory: cline-agents
        run: npm test
      - name: npm run typecheck
        if: steps.probe.outputs.present == 'true'
        working-directory: cline-agents
        run: npm run typecheck

  cline-lifecycle-plugin:
    name: cline-lifecycle/ (npm test, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cline-lifecycle
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cline-lifecycle/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  python-tools:
    name: tools/ and plugins/*/tools (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: tools/
        run: python3 -m unittest discover -s tools -p "test_*.py" -v
      - name: plugins/lifecycle/tools/
        run: python3 -m unittest discover -s plugins/lifecycle/tools -p "test_*.py" -v
      - name: plugins/lifecycle-github/tools/
        run: python3 -m unittest discover -s plugins/lifecycle-github/tools -p "test_*.py" -v
      - name: plugins/lifecycle-gitlab/tools/
        run: python3 -m unittest discover -s plugins/lifecycle-gitlab/tools -p "test_*.py" -v
