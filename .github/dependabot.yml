
# Dependabot configuration for deagy/cadre-lifecycle
#
# Automated dependency updates for TypeScript/Node.js workspace dependencies.
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Root package.json (workspace orchestration)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "npm"

  # cline/ workspace
  - package-ecosystem: "npm"
    directory: "/cline"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps:cline"
    labels:
      - "dependencies"
      - "npm"
      - "cline-plugin"

  # cline-agents/ workspace
  - package-ecosystem: "npm"
    directory: "/cline-agents"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps:cline-agents"
    labels:
      - "dependencies"
      - "npm"
      - "cline-agents"

  # cline-lifecycle/ workspace
  - package-ecosystem: "npm"
    directory: "/cline-lifecycle"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps:cline-lifecycle"
    labels:
      - "dependencies"
      - "npm"
      - "cline-lifecycle"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
